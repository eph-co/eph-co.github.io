<style>
:root {
  --bg: #f7f6f2; --card: #ffffff; --ink: #15171c; --muted: #5b6070; --line: #e4e1da;
  --accent: #f97316; --accent-ink: #c2410c;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15171c; --card: #1d2027; --ink: #f2f1ee; --muted: #a3a8b5; --line: #2c3039; --accent-ink: #fb923c; }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }
header.brand { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
header.brand svg { width: 56px; height: 56px; flex: none; }
header.brand h1 { margin: 0; font-size: 34px; line-height: 1.1; letter-spacing: -0.5px; }
.tagline { margin: 0 0 24px; color: var(--muted); }
h1.doc { font-size: 28px; line-height: 1.2; margin: 8px 0 16px; }
h2 { font-size: 20px; margin: 28px 0 8px; }
p, ul { margin: 0 0 12px; }
ul { padding-left: 22px; }
li { margin-bottom: 6px; }
a { color: var(--accent-ink); font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 20px; margin: 16px 0; }
.docs { list-style: none; padding: 0; margin: 0; }
.docs li { padding: 14px 0; border-top: 1px solid var(--line); margin: 0; }
.docs li:first-child { border-top: 0; }
.docs span { display: block; color: var(--muted); font-size: 15px; }
.back { display: inline-block; margin-bottom: 8px; }
footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
<h1 class="doc">Aplicaciones</h1>
<div class="card"><ul class="docs">
<li><a href="rodaje/">Rodaje</a><span>Gastos y mantenimiento de tu vehículo.</span></li>
</ul></div>
<footer>Contacto: <a href="mailto:eph.com.co@gmail.com">eph.com.co@gmail.com</a>.</footer>
</main>
</body>
</html>
